<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Web3Forms Debug | Shea Tea Tree</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    body{background:#f8f5ec;color:#173d26;font-family:Arial,Helvetica,sans-serif;margin:0;padding:30px}.box{max-width:760px;margin:40px auto;background:#fff;border:1px solid #d9ded5;border-radius:24px;padding:30px}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d9ded5;border-radius:12px;font:inherit}.field textarea{min-height:130px}button{width:100%;padding:15px;border:0;border-radius:999px;background:#174b2a;color:#fff;font-weight:900;cursor:pointer}.result{margin-top:20px;padding:16px;border-radius:12px;white-space:pre-wrap;line-height:1.5}.success{background:#edf5ef;border:1px solid #b9d4c0;color:#174b2a}.error{background:#fff2f2;border:1px solid #e5b7b7;color:#8b1f1f}.note{background:#edf5ef;border-left:5px solid #174b2a;padding:14px 16px;border-radius:10px;margin-bottom:18px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Web3Forms Debug Test</h1>
    <div class="note">This page tests the Web3Forms API directly and shows the exact response. It uses the current access key for info@sheateatree.com.</div>
    <form id="debugForm">
      <input type="hidden" name="access_key" value="52097989-f2ea-4c07-9e3e-ee0a77c2e13b">
      <input type="hidden" name="subject" value="Web3Forms Debug Test - Shea Tea Tree">
      <input type="hidden" name="from_name" value="Shea Tea Tree Website">
      <input type="checkbox" name="botcheck" style="display:none">
      <div class="field"><label>Name</label><input name="name" value="Website Test" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" value="info@sheateatree.com" required></div>
      <div class="field"><label>Message</label><textarea name="message" required>Testing Web3Forms delivery from sheateatree.com.</textarea></div>
      <button type="submit">Send Debug Test</button>
    </form>
    <div id="result" class="result" hidden></div>
  </div>
  <script>
    const form = document.getElementById('debugForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async function(e){
      e.preventDefault();
      result.hidden = false;
      result.className = 'result';
      result.textContent = 'Sending...';
      try {
        const formData = new FormData(form);
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        result.className = 'result ' + (data.success ? 'success' : 'error');
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.className = 'result error';
        result.textContent = 'Browser/API error:\n' + error.message;
      }
    });
  </script>
</body>
</html>
